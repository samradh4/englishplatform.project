services:
  - type: web
    name: bolo-english
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_DAYS
        value: 30
      - key: MAX_ROOM_PARTICIPANTS
        value: 8
      - key: VOICE_MODE
        value: auto
